databases:
  - name: opsnest-cloud-db
    databaseName: opsnest
    user: opsnest
    plan: basic-256mb

services:
  - type: web
    name: opsnest-cloud-api
    runtime: python
    plan: starter
    buildCommand: pip install -r opsnest_cloud/requirements.txt
    startCommand: uvicorn opsnest_cloud.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opsnest-cloud-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_PUBLIC_URL
        sync: false
      - key: APP_SIGNING_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PLAN_STARTER
        sync: false
      - key: PAYPAL_PLAN_BUSINESS
        sync: false
      - key: PAYPAL_PLAN_PRO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: OpsNest
      - key: TURNSTILE_SECRET_KEY
        sync: false
