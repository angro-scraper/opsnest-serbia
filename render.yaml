services:
  - type: web
    name: opsnest-cloud-api
    runtime: python
    plan: free
    buildCommand: pip install -r opsnest_cloud/requirements.txt
    startCommand: uvicorn opsnest_cloud.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: preview
      - key: APP_SIGNING_SECRET
        generateValue: true
      # Public desktop-release metadata. The Windows client verifies the
      # SHA-256 before installing the downloaded update.
      - key: DESKTOP_LATEST_VERSION
        value: 2.12.9
      - key: DESKTOP_INSTALLER_URL
        value: https://opsnestone.com/downloads/OpsNest-Setup-2.12.9.exe
      - key: DESKTOP_INSTALLER_SHA256
        value: 1785c7a73841e07bf94fb0a717e73b7cb3a6441d91bdb13f7ed0a0bda00d6e50
