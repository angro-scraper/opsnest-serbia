services:
  # Public product website. The root domain stays on the current static host
  # until its downloads folder contains the signed Windows installer.
  - type: web
    name: opsnest-public-site
    runtime: static
    staticPublishPath: public_site
    autoDeployTrigger: commit
    # Render does not read Apache .htaccess files. Keep the same clean public
    # URLs on the Render preview that the Adriahost site receives from .htaccess.
    routes:
      - type: rewrite
        source: /pricing
        destination: /pricing.html
      - type: rewrite
        source: /getting-started
        destination: /getting-started.html
      - type: rewrite
        source: /support
        destination: /support.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /cancellation
        destination: /cancellation.html

  - type: web
    name: opsnest-cloud-api
    runtime: python
    plan: free
    buildCommand: pip install -r opsnest_cloud/requirements.txt
    startCommand: uvicorn opsnest_cloud.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    domains:
      - api.opsnestone.com
    envVars:
      # The first deploy stays safe until every secret below is configured.
      - key: APP_ENV
        value: production
      - key: APP_PUBLIC_URL
        value: https://api.opsnestone.com
      - key: CORS_ORIGINS
        value: https://opsnestone.com
      - key: APP_SIGNING_SECRET
        generateValue: true
      # Generated only in Render. It encrypts a Desktop workspace snapshot
      # before it is stored in Postgres; never put it in GitHub or the installer.
      - key: WORKSPACE_SNAPSHOT_ENCRYPTION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: opsnest-cloud-postgres
          property: connectionString
      - key: PAYPAL_MODE
        value: live
      # Permanent internal Pro access for the product owner. Keep the exact
      # owner e-mail(s) only in Render, never in the repository or installer.
      - key: FOUNDER_WORKSPACE_EMAILS
        sync: false
      # Set every value marked sync:false only in the Render dashboard.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PLAN_STARTER
        sync: false
      - key: PAYPAL_PLAN_BUSINESS
        sync: false
      - key: PAYPAL_PLAN_PRO
        sync: false
      # Optional AI Adviser tiers: 100 / 200 / 300 reviews per month.
      # Configure the active PayPal subscription-plan IDs before offering them.
      - key: PAYPAL_PLAN_AI_STARTER
        sync: false
      - key: PAYPAL_PLAN_AI_BUSINESS
        sync: false
      - key: PAYPAL_PLAN_AI_PRO
        sync: false
      - key: SMTP_HOST
        value: mail.opsnestone.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: support@opsnestone.com
      - key: SMTP_FROM_NAME
        value: OpsNest Support
      # Render free web services block outbound SMTP. Use the HTTPS mail API.
      - key: RESEND_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        value: support@opsnestone.com
      # Publish the Windows setup URL and version before each release.
      - key: DESKTOP_LATEST_VERSION
        value: 2.13.6
      - key: DESKTOP_INSTALLER_URL
        value: https://opsnestone.com/downloads/OpsNest-Setup-2.13.6.exe
      # Publish the SHA-256 for the same installer URL. The desktop client
      # verifies this digest before it starts any downloaded update.
      - key: DESKTOP_INSTALLER_SHA256
        value: 49fb195879ec4e000cfe9cd9b53fbd0aafe756e7a1b78797c7692327e612ab02
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # AI is Pro-only. Store the secret in Render; the desktop application
      # receives only generated advice and never the API key.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      # Private platform-control console at https://api.opsnestone.com/admin.
      # Never put these values in GitHub, the desktop installer or the website.
      - key: OPSNEST_ADMIN_EMAIL
        sync: false
      - key: OPSNEST_ADMIN_PASSWORD
        sync: false
      # Document Inbox stays disabled until a private EU S3-compatible bucket
      # and its retention policy are explicitly chosen. Never store these
      # credentials in GitHub or the desktop application.
      - key: DOCUMENT_STORAGE_ENDPOINT
        sync: false
      - key: DOCUMENT_STORAGE_REGION
        value: eu-central-1
      - key: DOCUMENT_STORAGE_BUCKET
        sync: false
      - key: DOCUMENT_STORAGE_ACCESS_KEY
        sync: false
      - key: DOCUMENT_STORAGE_SECRET_KEY
        sync: false

databases:
  - name: opsnest-cloud-postgres
    plan: basic-256mb
    databaseName: opsnest
    user: opsnest
