services:
  - type: web
    name: opsnest-cloud-api
    runtime: python
    plan: free
    buildCommand: pip install -r opsnest_cloud/requirements.txt
    startCommand: uvicorn opsnest_cloud.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    domains:
      - api.opsnestone.com
    envVars:
      # The first deploy stays safe until every secret below is configured.
      - key: APP_ENV
        value: preview
      - key: APP_PUBLIC_URL
        value: https://api.opsnestone.com
      - key: CORS_ORIGINS
        value: https://opsnestone.com
      - key: APP_SIGNING_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: opsnest-cloud-postgres
          property: connectionString
      - key: PAYPAL_MODE
        value: sandbox
      # Set every value marked sync:false only in the Render dashboard.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PLAN_STARTER
        sync: false
      - key: PAYPAL_PLAN_BUSINESS
        sync: false
      - key: PAYPAL_PLAN_PRO
        sync: false
      - key: SMTP_HOST
        value: mail.opsnestone.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: support@opsnestone.com
      - key: SMTP_FROM_NAME
        value: OpsNest Support
      # Render free web services block outbound SMTP. Use the HTTPS mail API.
      - key: RESEND_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        value: support@opsnestone.com
      # Publish the signed Windows setup URL and version before each release.
      - key: DESKTOP_LATEST_VERSION
        value: 2.8.7
      - key: DESKTOP_INSTALLER_URL
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

databases:
  - name: opsnest-cloud-postgres
    plan: basic-256mb
    databaseName: opsnest
    user: opsnest
